<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Screenshare Community</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", sans-serif;
        background: transparent;
        overflow: hidden;
      }

      .window {
        width: 100%;
        height: 100vh;
        border-radius: 18px;
        overflow: hidden;
        background: #02040a;
        position: relative;
      }

      .drag {
        -webkit-app-region: drag;
      }

      .no-drag {
        -webkit-app-region: no-drag;
      }

      .grid-bg {
        background-image:
          linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          );
        background-size: 40px 40px;
      }

      .ambient-glow {
        position: absolute;
        width: 400px;
        height: 400px;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.05) 0%,
          transparent 70%
        );
        border-radius: 50%;
        filter: blur(60px);
        z-index: 0;
      }

      .glow-bar {
        box-shadow:
          0 0 15px rgba(255, 255, 255, 0.3),
          0 0 30px rgba(255, 255, 255, 0.1);
      }

      @keyframes pulse-search {
        0%,
        100% {
          opacity: 0.5;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      .searching-icon {
        animation: pulse-search 2s ease-in-out infinite;
      }

      .scanline {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          transparent 50%,
          rgba(0, 0, 0, 0.2) 50%
        );
        background-size: 100% 4px;
        opacity: 0.1;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div class="window grid-bg flex items-center justify-center text-white">
      <!-- CLOSE BUTTON -->
      <div class="absolute top-3 right-3 z-50 no-drag">
        <button
          onclick="window.close()"
          class="w-8 h-8 flex items-center justify-center rounded-md bg-white/5 hover:bg-white/10 border border-white/10 text-white/70 hover:text-white transition"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="ambient-glow" style="top: 10%; left: 20%"></div>
      <div class="ambient-glow" style="bottom: 10%; right: 20%"></div>
      <div class="scanline"></div>

      <!-- MAIN -->
      <div class="w-[400px] flex flex-col items-center relative z-10">
        <!-- LOGO -->
        <div class="relative mb-8 drag">
          <div
            class="absolute -inset-6 border-t-2 border-b-2 border-white/10 rounded-full animate-spin"
          ></div>
          <div
            class="absolute -inset-4 border-l-2 border-r-2 border-white/5 rounded-full animate-[spin_10s_linear_reverse_infinite]"
          ></div>

          <div class="relative">
            <img
              src="../assets/logo.png"
              class="w-28 h-28 rounded-full border border-white/20 bg-black/40 shadow-2xl"
            />

            <div
              class="absolute bottom-1 right-1 w-5 h-5 bg-white rounded-full border-4 border-[#02040a] shadow-[0_0_10px_rgba(255,255,255,0.8)]"
            ></div>
          </div>
        </div>

        <!-- TITLE -->
        <div class="text-center space-y-2 mb-12 drag">
          <h1 class="text-4xl font-extrabold">
            Minecraft<span class="text-white/70">.</span>
          </h1>
          <p class="text-[11px] uppercase tracking-[0.5em] text-white/70">
            Screenshare Community
          </p>
        </div>

        <!-- PROGRESS SECTION -->
        <div class="w-full px-6 no-drag">
          <!-- TOP INFO -->
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
              <div class="p-2 bg-white/5 rounded-lg border border-white/10">
                <i class="fa-solid fa-magnifying-glass searching-icon"></i>
              </div>

              <div class="flex flex-col">
                <span id="status-text" class="text-[10px] uppercase"
                  >Scanning...</span
                >
                <span id="sub-status" class="text-[10px] text-gray-400">
                  File fetch process begins...
                </span>
              </div>
            </div>

            <span id="percent-text" class="text-2xl font-light font-mono"
              >0%</span
            >
          </div>

          <!-- PROGRESS BAR -->
          <div
            class="h-[6px] w-full bg-white/5 rounded-full overflow-hidden border border-white/5"
          >
            <div
              id="bar"
              class="glow-bar h-full w-0 bg-white transition-all duration-500"
            ></div>
          </div>

          <!-- DISCORD BUTTON -->
          <div class="mt-6 flex flex-col items-center gap-3">
            <a
              href="https://discord.gg/bDF8nsVShp"
              target="_blank"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 hover:text-white transition backdrop-blur-md"
            >
              <i class="fa-brands fa-discord text-sm"></i>
              <span class="text-xs font-medium tracking-wide"
                >Join Discord</span
              >
            </a>
          </div>

          <!-- EXECUTE VOID SCRIPT -->
          <div class="mt-6 flex flex-col items-center gap-3">
            <button
              id="void-btn"
              class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 hover:text-white transition backdrop-blur-md"
            >
              <i class="fa-solid fa-copy"></i>
              <span class="text-xs font-medium tracking-wide"
                >Copy Void Script</span
              >
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>

    <script>
      window.addEventListener("ui-update", (event) => {
        const data = event.detail;

        document.getElementById("bar").style.width = data.progress + "%";
        document.getElementById("percent-text").innerText = data.progress + "%";
        document.getElementById("status-text").innerText = data.msg;
        document.getElementById("sub-status").innerText = data.sub;
      });
    </script>

    <!-- FOOTER -->
    <div class="absolute bottom-3 left-0 w-full flex justify-center no-drag">
      <p class="text-[11px] text-white/30 tracking-wide">
        © 2026 All rights reserved. Minecraft Screenshare Community.
      </p>
    </div>
  </body>
</html>
